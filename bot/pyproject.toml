[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-call-log-bot"
version = "1.0.0"
description = "Pipecat WebRTC Voice AI bot for Mini Call Log Service"
authors = [{ name = "Voice AI Engineer" }]
dependencies = [
    "fastapi==0.142.2",
    "uvicorn==0.53.0",
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["bot/tests"]
pythonpath = ["."]
