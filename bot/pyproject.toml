[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-call-log-bot"
version = "1.0.0"
description = "Pipecat WebRTC Voice AI bot for Mini Call Log Service"
authors = [{ name = "Voice AI Engineer" }]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["bot/tests"]
pythonpath = ["."]
