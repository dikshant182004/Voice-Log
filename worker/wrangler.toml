name = "mini-call-log-worker"
main = "src/index.ts"
compatibility_date = "2026-10-07"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

[[d1_databases]]
binding = "DB"
database_name = "mini-call-log-db"
database_id = "4ced6801-eac0-4d70-bfd3-d23f04ed484c"
migrations_dir = "migrations"

[vars]
ALLOWED_ORIGIN = "http://localhost:3000"
BOT_URL = "http://localhost:8765"

# Secrets to be set via `npx wrangler secret put <KEY>`:
# - INGEST_TOKEN
# - GROQ_API_KEY
